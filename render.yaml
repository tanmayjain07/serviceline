# Render Blueprint -- infrastructure as code for the demo deployment.
#
# Import this from the Render dashboard (New > Blueprint) and point it at this
# repository. Render creates both services from this file, so the deployment is
# reviewable in the repo rather than living only in a dashboard nobody can
# audit.
#
# The database is NOT defined here. It lives on Neon, whose free tier does not
# expire, whereas Render's free Postgres is deleted after 30 days -- not a
# useful property for a portfolio demo you want to still work in six months.
#
# Setup order matters, because the API refuses to start against a database that
# is not enforcing tenant isolation:
#   1. Create the Neon project.
#   2. Run scripts/bootstrap-cloud-db.sql in Neon's SQL editor. This creates the
#      low-privilege application role.
#   3. Deploy this blueprint and fill in the three env vars marked `sync: false`.
# See docs/deployment.md for the walkthrough.

services:
  # ------------------------------------------------------------------
  # API
  # ------------------------------------------------------------------
  - type: web
    name: serviceline-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render polls this to decide whether a deploy succeeded. It points at
    # /healthz rather than /readyz on purpose: /healthz is liveness only and does
    # not touch Postgres, so a brief database blip cannot cause Render to tear
    # down a perfectly healthy container.
    healthCheckPath: /healthz

    envVars:
      - key: ENVIRONMENT
        value: production

      # Runtime connection, as the low-privilege serviceline_app role created by
      # scripts/bootstrap-cloud-db.sql. Set this by hand -- it holds a password.
      - key: DATABASE_URL
        sync: false

      # Migrations only, as the Neon owner role. Also set by hand.
      - key: DATABASE_ADMIN_URL
        sync: false

      # Render generates a strong value once and keeps it stable across deploys.
      # Never commit this or reuse the development secret.
      - key: JWT_SECRET
        generateValue: true

      # A JSON array of allowed browser origins, e.g.
      #   ["https://serviceline-web.onrender.com"]
      # Set after the static site exists and you know its URL.
      - key: CORS_ORIGINS
        sync: false

      # Seeds the two demo companies on start. Idempotent.
      - key: DEMO_MODE
        value: "true"

  # ------------------------------------------------------------------
  # Frontend
  # ------------------------------------------------------------------
  - type: web
    name: serviceline-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Baked in at build time by Vite, so a change here needs a redeploy, not
      # just a restart. Set to the API's URL plus /api/v1, e.g.
      #   https://serviceline-api.onrender.com/api/v1
      - key: VITE_API_BASE_URL
        sync: false

      # Shows the published demo logins on the sign-in page. Not a secret, and
      # this blueprint describes only the public demo, so it is declared here
      # rather than prompted for. With it unset, the demo panel and its
      # credentials are tree-shaken out of the bundle entirely.
      - key: VITE_DEMO_MODE
        value: "true"

    routes:
      # Single-page app: every unmatched path must return index.html so that
      # React Router can handle it. Without this, deep links and browser refresh
      # on any route other than / return a 404 from the static host.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
