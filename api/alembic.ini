[alembic]
script_location = alembic
prepend_sys_path = .
# Alembic >=1.16 replaced version_path_separator with path_separator. Without it
# Alembic falls back to legacy splitting on spaces and colons, which breaks on
# Windows paths like C:\Users\...
path_separator = os

# The database URL is intentionally NOT set here. alembic/env.py reads it from
# settings.database_admin_url, so migrations always run as the owning role and
# the connection string lives in exactly one place (.env).

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
